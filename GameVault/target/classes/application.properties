spring.application.name=GameVault

# Tamaño máximo de archivo (el formulario indica 2MB por archivo)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Base de datos: esta práctica usa una lista en memoria, así que la app
# no debe necesitar MySQL para arrancar.
spring.datasource.url=jdbc:mysql://localhost:3306/gamevault
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
